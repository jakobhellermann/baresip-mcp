name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

  smoke:
    name: live baresip smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: install baresip
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends baresip netcat-openbsd

      - name: locate baresip modules
        id: modpath
        run: |
          for cand in /usr/lib/x86_64-linux-gnu/baresip/modules /usr/lib/baresip/modules; do
            if [ -f "$cand/ctrl_tcp.so" ]; then
              echo "modpath=$cand" >>"$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ctrl_tcp.so not found in known baresip module paths" >&2
          exit 1

      - name: smoke test
        env:
          BARESIP_MODPATH: ${{ steps.modpath.outputs.modpath }}
        run: ./scripts/smoke.sh

      - name: e2e test (two baresip processes)
        env:
          BARESIP_MODPATH: ${{ steps.modpath.outputs.modpath }}
        run: go test -tags e2e -count=1 -timeout 60s ./test/e2e/ -v
